name: Release

# Push a tag like v1.0.0 (it must match package.json) to build, sign, notarize and draft a release.
# Actions are pinned to commit SHAs. The build job holds the signing secrets but cannot write to the repository;
# the publish job can create the draft release but never sees the signing secrets.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    # Create a "release" environment under Settings > Environments and add required reviewers to gate signing.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Update URL must be https
        env:
          ENVAULT_UPDATE_URL: ${{ secrets.ENVAULT_UPDATE_URL }}
        run: |
          case "$ENVAULT_UPDATE_URL" in
            https://*) ;;
            *) echo "ENVAULT_UPDATE_URL must start with https://"; exit 1 ;;
          esac

      - run: npm run typecheck
      - run: npm run lint:design
      - run: npm test

      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ENVAULT_UPDATE_URL: ${{ secrets.ENVAULT_UPDATE_URL }}
        run: npm run build:mac

      - name: Verify signature, notarization and launch
        run: |
          APP=release/mac-arm64/EnVault.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -t exec -vv "$APP"
          xcrun stapler validate "$APP"
          npm run smoke:packaged -- "$APP"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/beta-mac.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - name: Draft GitHub release with the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "EnVault ${GITHUB_REF_NAME#v}" \
            --notes "See CHANGELOG.md. Copy the .dmg, .zip, .blockmap and latest-mac.yml files to the update server (docs/RELEASING.md)." \
            release-files/*
